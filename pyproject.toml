[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ldap-sync"
version = "0.1.0"
description = "Push-based one-way sync of user entries from a source LDAP into a target LDAP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bsquizz" }]
dependencies = [
    "ldap3>=2.9",
    "PyYAML>=6",
]

[project.optional-dependencies]
# auth.method: gssapi needs the gssapi pkg (system krb5 libs to build); ldap3's GSSAPI bind
# over ldaps:// also needs cryptography for TLS channel bindings.
gssapi = ["gssapi>=1.8", "cryptography>=3"]
dev = ["pytest>=7"]

[project.scripts]
ldap-sync = "ldap_sync.__main__:main"

[project.urls]
Homepage = "https://github.com/bsquizz/ldap-sync"

[tool.setuptools]
packages = ["ldap_sync"]
